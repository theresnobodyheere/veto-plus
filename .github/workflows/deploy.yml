# Construit et publie Véto+ sur GitHub Pages.
# Chaque mois, la base des médicaments ANMV est retéléchargée (data.gouv.fr) avant la publication.
name: Publication

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 1 * *'   # le 1er de chaque mois à 4 h UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Version fixée : ubuntu-latest passe à Ubuntu 26 le 19/10/2026 ; l'image 24.04 fournit 7z pour la base ANMV.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mise à jour de la base médicaments ANMV
        run: npm run data:anmv
        continue-on-error: true   # en cas d'indisponibilité, on garde la base du dépôt
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
